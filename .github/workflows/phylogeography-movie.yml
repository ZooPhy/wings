name: Phylogeography movie
on:
  push:
    paths:
      - 'scripts/report/**'
      - 'scripts/*phylogeography*'
      - 'tests/test_phylogeography*'
      - '.github/workflows/phylogeography-movie.yml'
  pull_request:
    paths:
      - 'scripts/report/**'
      - 'scripts/*phylogeography*'
      - 'tests/test_phylogeography*'
      - '.github/workflows/phylogeography-movie.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_explorer_assets.py --check
      - run: node --test tests/test_phylogeography_movie.cjs tests/test_explorer_tabs.cjs tests/test_explorer_navigation.cjs
      - run: python -m unittest discover -s tests -p 'test_phylogeography_movie_import.py'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_phylogeography_movie_browser.cjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/render_phylogeography_movie.cjs --example --output /tmp/movie.mp4 --seconds 1 --fps 4
