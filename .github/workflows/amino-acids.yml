name: Amino acid comparisons
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparisons:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p "test_amino_*.py" -v
      - run: node tests/test_amino_visual.cjs
      - run: python -m pip install snakemake==9.24.0
      - run: python tests/integration_amino_acids.py --repo .
