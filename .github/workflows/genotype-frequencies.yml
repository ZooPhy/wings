name: Genotype frequency reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genotype-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check snapshot imports and portable embedding
        run: python -m unittest discover -s tests -p 'test_genotype*.py'
      - name: Check frequency calculations, offline loading, and dashboard tabs
        run: node --test tests/test_genotype_frequencies.cjs tests/test_genotype_dashboard.cjs tests/test_explorer_tabs.cjs
