name: GenoFLU workspace paths
on:
  pull_request:
    paths:
      - Snakefile
      - scripts/run_genoflu_safe.py
      - tests/test_genoflu_workspace_paths.py
      - .github/workflows/genoflu-paths.yml
  workflow_dispatch:
jobs:
  paths:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_genoflu_workspace_paths.py -v
