name: Model explorer
on:
  push:
    paths:
      - 'scripts/report/concordance-model-explorer.*'
      - 'scripts/report/genomic-ecological-concordance.*'
      - 'scripts/report/templates/surveillance-explorer.*'
      - 'scripts/attach_genomic_ecological_concordance.py'
      - 'scripts/refresh_concordance_inputs.py'
      - 'scripts/refresh_report_model_explorer.py'
      - 'scripts/refresh_demo_navigation.py'
      - 'tests/test_model_explorer*'
      - 'tests/fixtures/concordance_model_explorer.json'
      - '.github/workflows/model-explorer.yml'
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python scripts/build_explorer_assets.py --check
      - run: python scripts/refresh_demo_navigation.py --repo . --check
      - run: node --test tests/test_model_explorer.cjs tests/test_genomic_ecological_concordance_ui.cjs
      - run: python -m unittest discover -s tests -p 'test_model_explorer*.py'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_model_explorer_browser.cjs
