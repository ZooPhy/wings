name: Phylodynamics submission
on: [push, pull_request]
jobs:
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pyyaml snakemake
      - run: python tests/test_phylodynamics_submission.py
      - run: node --test tests/test_phylodynamics_submission.cjs
      - run: node --check assets/wings-run.js
      - run: python tests/check_phylodynamics_submission_workflow.py
