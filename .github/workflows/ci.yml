name: WINGS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: snakemake_env
          python-version: "3.12"
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-activate-base: false

      - name: Install test dependencies
        shell: bash -el {0}
        run: |
          conda install -y \
            -c conda-forge \
            -c bioconda \
            snakemake=9.24.0 \
            pytest

      - name: Show versions
        shell: bash -el {0}
        run: |
          python --version
          snakemake --version
          pytest --version
          conda --version

      - name: Run WINGS regression tests
        shell: bash -el {0}
        run: |
          python -m pytest -q \
          tests/test_regression.py \
          tests/test_sample_summary_segments.py \
          tests/test_surveillance_explorer.py \
          tests/test_linked_genome_explorer.py \
          tests/test_outbreak_context.py \
          tests/test_ecological_context.py \
          tests/test_public_reference_context.py \
          tests/test_replay_archive.py \
          tests/test_wings_local_runner.py

  explorer-browser:
    name: Linked explorer / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check explorer state and retained local behavior
        run: node --test tests/test_linked_genome_state.cjs tests/test_surveillance_map.cjs tests/test_outbreak_context.cjs tests/test_ecological_context.cjs tests/test_public_reference_context.cjs
      - name: Check linked explorer interactions
        run: node tests/test_linked_genome_explorer.cjs
      - name: Check completed-run results auto-open
        run: node tests/test_results_auto_open.cjs
      - name: Check run status recovery after browser restart
        run: node tests/test_run_recovery.cjs
