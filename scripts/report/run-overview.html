<!-- WINGS_RUN_OVERVIEW_V1 -->
<style>
.wro{font-family:Arial,Helvetica,sans-serif;color:#171717}.wro *{box-sizing:border-box}.wro-hero{background:#111;border-top:6px solid #FFC627;border-radius:16px;padding:24px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.wro h3{font-size:25px;margin:8px 0 16px}.wro-hero h3{color:white}.wro-kicker{color:#FFC627;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.wro-total{font-size:42px;font-weight:700;white-space:nowrap}.wro-total small{display:block;font-size:14px;color:#ddd;font-weight:400}.wro-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.wro-card{font:inherit;background:#8C1D40;color:white;text-align:left;border:3px solid transparent;border-top:5px solid #FFC627;border-radius:14px;padding:18px;cursor:pointer}.wro-card:nth-child(even){background:#111}.wro-card[aria-pressed=true]{border-color:#FFC627}.wro-card span{display:block;color:#FFC627;font-size:13px;font-weight:700;text-transform:uppercase}.wro-card strong{display:block;font-size:30px;margin:7px 0}.wro-card small{font-size:13px}.wro-panel{border:1px solid #ddd;border-top:6px solid #111;border-radius:16px;padding:22px;margin:20px 0}.wro-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.wro-screen{display:block;width:100%;font:inherit;background:white;border:1px solid #ddd;border-radius:9px;padding:14px;margin:10px 0;text-align:left;cursor:pointer;color:#222}.wro-screen[aria-pressed=true]{border:2px solid #8C1D40;background:#fff7df}.wro-screen strong{float:right}.wro-track{height:8px;background:#eee;border-radius:6px;margin-top:12px}.wro-track i{display:block;height:100%;border-radius:6px}.wro-detail{background:#111;color:white;border-top:6px solid #FFC627;border-radius:14px;padding:22px;min-width:0}.wro-detail h3{color:#FFC627}.wro-detail ul{max-height:260px;overflow:auto;padding-left:20px}.wro-detail li{margin:9px 0}.wro-detail a{color:white;overflow-wrap:anywhere}.wro details{margin:18px 0;font-size:14px;color:#555}.wro summary{font-weight:700;cursor:pointer}.wro-reset{font:inherit;border:1px solid #8C1D40;color:#8C1D40;border-radius:6px;background:white;padding:8px 12px;cursor:pointer}.wro-note{font-size:14px;color:#555}.wro-history{border:1px solid #ddd;border-left:6px solid #8C1D40;border-radius:12px;padding:20px;margin:20px 0}.wro-history>h3{margin-top:0}.wro-history .alert{background:#f5f5f5;border:0;border-radius:8px}@media(max-width:800px){.wro-layout{grid-template-columns:1fr}.wro-cards{grid-template-columns:1fr 1fr}}@media(max-width:450px){.wro-hero{align-items:flex-start;flex-direction:column}}
</style>
<script>
(()=>{const init=()=>{
 const overview=document.getElementById('overview'),screen=document.getElementById('h5-screening'),history=document.getElementById('historical-stability'),tab=overview?.closest('.tab-pane');
 if(!tab||!screen||!tab.contains(screen)||tab.querySelector('.wro'))return;
 const rows=Array.from(document.querySelectorAll('td[headers="sample_id"]')).map(cell=>{const row=cell.closest('tr'),read=k=>row.querySelector(`td[headers="${k}"]`)?.textContent.trim();return {id:cell.textContent.trim(),href:cell.querySelector('a')?.getAttribute('href'),qc:read('QC')||'Not recorded',screen:read('h5_screen')||'Not recorded',pass:read('pass_segments')||'NA'};});
 if(!rows.length)return;
 const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
 const ui=el('div','wro'),hero=el('div','wro-hero'),intro=el('div');intro.append(el('div','wro-kicker','Run summary'),el('h3','','Your run at a glance'),el('div','','Genome recovery and recorded H5 screening results'));
 const total=el('div','wro-total',rows.length);total.append(el('small','','samples'));hero.append(intro,total);ui.append(hero);
 const cards=el('div','wro-cards'),buttons=[],detail=el('div','wro-detail');detail.setAttribute('aria-live','polite');
 const percent=n=>`${(100*n/rows.length).toFixed(1)}%`;
 const show=(samples,title)=>{detail.replaceChildren(el('div','wro-kicker','Selected samples'),el('h3','',title),el('p','',`${samples.length} of ${rows.length} samples · ${percent(samples.length)}`));const list=el('ul');samples.forEach(s=>{const li=el('li'),a=el('a','',s.id);if(s.href&&!/^(?:[a-z]+:|\/\/)/i.test(s.href))a.href=s.href;li.append(a,document.createTextNode(` · ${s.pass}/8 segments pass`));list.append(li);});if(!samples.length)detail.append(el('p','','No samples in this category.'));detail.append(list);};
 const choose=(b,samples,title)=>{buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show(samples,title);};
 for(const [label,definition] of [['Complete','8/8 segments pass'],['Near-complete','6–7/8 segments pass'],['Partial','1–5/8 segments pass'],['Failed','0/8 segments pass']]){const samples=rows.filter(s=>s.qc===label),b=el('button','wro-card');b.type='button';b.setAttribute('aria-pressed','false');b.append(el('span','',label),el('strong','',`${samples.length} · ${percent(samples.length)}`),el('small','',definition));b.addEventListener('click',()=>choose(b,samples,label));buttons.push(b);cards.append(b);}ui.append(cards);
 const panel=el('div','wro-panel'),layout=el('div','wro-layout'),left=el('div');left.append(el('h3','','H5 screening'),el('p','wro-note','Select a result to see its samples. Counts use all samples in this run.'));
 const states=[['DETECTED','Detected','#8C1D40'],['INDETERMINATE','Indeterminate','#FFC627'],['NOT_DETECTED','Not detected','#777']];
 const extras=[...new Set(rows.map(s=>s.screen))].filter(s=>!states.some(t=>t[0]===s));extras.forEach(s=>states.push([s,s,'#777']));
 states.forEach(([state,label,color])=>{const samples=rows.filter(s=>s.screen===state),b=el('button','wro-screen');b.type='button';b.setAttribute('aria-pressed','false');b.append(document.createTextNode(label),el('strong','',`${samples.length} · ${percent(samples.length)}`));const track=el('div','wro-track'),fill=el('i');fill.style.width=percent(samples.length);fill.style.background=color;track.append(fill);b.append(track);b.addEventListener('click',()=>choose(b,samples,label));buttons.push(b);left.append(b);});
 const reset=el('button','wro-reset','Show all samples');reset.type='button';reset.addEventListener('click',()=>choose(null,rows,'All samples'));left.append(reset);layout.append(left,detail);panel.append(layout);
 const defs=el('details');defs.append(el('summary','','Screening definitions'));const list=el('ul');
 const definitions=[['DETECTED','QC-passing H5 HA and subtype-resolved NA (H5Nx).'],['NOT DETECTED','QC-passing HA is not H5, regardless of NA.'],['INDETERMINATE','HA is uninformative, or H5 is present but NA is missing, fails QC, or is unresolved.']];
 definitions.forEach(([label,text])=>{const li=el('li');li.append(el('strong','',label+': '),document.createTextNode(text));list.append(li);});
 defs.append(list,el('p','','GenoFLU runs only for DETECTED samples.'));panel.append(defs);ui.append(panel);
 // Replace overview displays and remove Historical Stability from this tab.
 overview.hidden=true;screen.hidden=true;tab.insertBefore(ui,overview);
 if(history)history.remove();
 show(rows,'All samples');
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();})();
</script>
<!-- /WINGS_RUN_OVERVIEW_V1 -->
