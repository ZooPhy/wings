<script>

  const layout=el('div','wdo-layout'),left=el('div'),panel=el('div','wdo-detail'),legend=el('div','wdo-legend');panel.setAttribute('aria-live','polite');
  const ns='http://www.w3.org/2000/svg',sv=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;};

  let angle=-Math.PI/2;groups.forEach(([name,samples],i)=>{const amount=2*Math.PI*samples.length/eligible.length,end=angle+amount;let path;

<style>
.wco{font-family:Arial,Helvetica,sans-serif;color:#171717}.wco *{box-sizing:border-box}.wco h3{font-size:25px;margin:8px 0 16px}.wco-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.wco-card{font:inherit;background:#111;color:white;text-align:left;border:3px solid transparent;border-top:6px solid #FFC627;border-radius:14px;padding:18px;cursor:pointer}.wco-card:nth-child(even){background:#8C1D40}.wco-card[aria-pressed=true]{border-color:#FFC627}.wco-card span{display:block;color:#FFC627;font-weight:700;font-size:13px;text-transform:uppercase}.wco-card strong{display:block;font-size:32px;margin:6px 0}.wco-card small{font-size:13px}.wco-panel{border:1px solid #ddd;border-top:6px solid #111;border-radius:16px;padding:22px;margin:20px 0}.wco-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.wco-chart{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px;align-items:end;height:220px}.wco-bin{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;background:none;border:0;padding:0;cursor:pointer;font:inherit}.wco-bin i{display:block;width:100%;background:#8C1D40;border-radius:5px 5px 0 0;margin:5px 0;min-height:2px}.wco-bin[aria-pressed=true] i{background:#FFC627;outline:2px solid #111}.wco-bin span{font-weight:bold}.wco-detail{background:#111;color:white;border-radius:14px;border-top:6px solid #FFC627;padding:20px;min-width:0}.wco-detail h3{color:#FFC627}.wco-detail ul{max-height:230px;overflow:auto;padding-left:20px}.wco-detail a{color:white;overflow-wrap:anywhere}.wco-detail li{margin:8px 0}.wco-reset{font:inherit;background:white;color:#8C1D40;border:1px solid #8C1D40;border-radius:6px;padding:7px 12px;cursor:pointer}.wco-depth{max-height:440px;overflow:auto}.wco-depth-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(60px,2fr) 105px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}.wco-depth-row a{color:#8C1D40;overflow-wrap:anywhere}.wco-track{background:#eee;height:10px;border-radius:5px}.wco-track i{display:block;height:100%;background:#8C1D40;border-radius:5px}.wco-depth-row strong{text-align:right}.wco details{font-size:14px;color:#555;margin:20px 0}.wco summary{font-weight:bold;cursor:pointer}.wco-note{color:#555;font-size:14px}@media(max-width:800px){.wco-cards{grid-template-columns:1fr 1fr}.wco-layout{grid-template-columns:1fr}}@media(max-width:500px){.wco-depth-row{grid-template-columns:1fr 75px}.wco-track{display:none}}

<script>
(()=>{const init=()=>{
 const original=document.getElementById('qc-qualified-genome-completeness'),tab=original?.closest('.tab-pane');if(!tab||tab.querySelector('.wco'))return;
 const rows=Array.from(document.querySelectorAll('td[headers="sample_id"]')).map(cell=>{const row=cell.closest('tr');const read=k=>row.querySelector(`td[headers="${k}"]`)?.textContent.trim();const numeric=t=>t && !['NA','N/A','—'].includes(t)?Number(t.replace(/,/g,'')):NaN;return {id:cell.textContent.trim(),href:cell.querySelector('a')?.getAttribute('href'),status:read('QC'),pass:numeric(read('pass_segments')),depth:numeric(read('subtype_min_median_depth'))};});
 if(!rows.length)return;
 const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
 const link=s=>{const a=el('a','',s.id);if(s.href&&!/^(?:[a-z]+:|\/\/)/i.test(s.href))a.href=s.href;return a;};
 const ui=el('div','wco');ui.append(el('h3','','Genome Coverage Overview'),el('p','wco-note',`${rows.length} samples · select a completeness category or a passing-segment count to explore samples.`));
 const cards=el('div','wco-cards'),buttons=[],bins=[];const panel=el('div','wco-panel'),layout=el('div','wco-layout'),chartArea=el('div'),chart=el('div','wco-chart'),detail=el('div','wco-detail');detail.setAttribute('aria-live','polite');
 const depths=el('div','wco-depth'),depthTitle=el('h3','','Minimum subtype median depth'),selection=el('p','wco-note');
 const max=Math.max(1,...rows.filter(s=>Number.isFinite(s.depth)&&s.depth>=0).map(s=>s.depth));
 const show=(selected,title)=>{
  detail.replaceChildren(el('h3','',title),el('p','',`${selected.length} of ${rows.length} samples (${(selected.length*100/rows.length).toFixed(1)}%)`));const ul=el('ul');selected.forEach(s=>{const li=el('li');li.append(link(s),document.createTextNode(` · ${Number.isFinite(s.pass)?s.pass:'NA'}/8 pass`));ul.append(li);});detail.append(ul);
  selection.textContent=`${title} · ${selected.length} samples`;depths.replaceChildren();
  [...selected].sort((a,b)=>(Number.isFinite(b.depth)?b.depth:-1)-(Number.isFinite(a.depth)?a.depth:-1)||a.id.localeCompare(b.id)).forEach(s=>{const row=el('div','wco-depth-row'),track=el('div','wco-track'),fill=el('i');fill.style.width=Number.isFinite(s.depth)&&s.depth>=0?`${Math.log10(s.depth+1)/Math.log10(max+1)*100}%`:'0%';track.append(fill);row.append(link(s),track,el('strong','',Number.isFinite(s.depth)?`${s.depth.toLocaleString(undefined,{maximumFractionDigits:1})}×`:'Not recorded'));depths.append(row);});
 };
 const clear=()=>{[...buttons,...bins].forEach(b=>b.setAttribute('aria-pressed','false'));};
 for(const [name,definition] of [['Complete','8/8 segments'],['Near-complete','6–7/8 segments'],['Partial','1–5/8 segments'],['Failed','0/8 segments']]){
  const count=rows.filter(s=>s.status===name).length,b=el('button','wco-card');b.type='button';b.setAttribute('aria-pressed','false');b.append(el('span','',name),el('strong','',count),el('small','',`${definition} · ${(count*100/rows.length).toFixed(1)}%`));b.addEventListener('click',()=>{clear();b.setAttribute('aria-pressed','true');show(rows.filter(s=>s.status===name),name);});buttons.push(b);cards.append(b);
 }
 ui.append(cards);panel.append(el('h3','','Passing genome segments'));chartArea.append(el('p','wco-note','Number of samples at each count of QC-passing segments.'));
 const counts=Array.from({length:9},(_,i)=>rows.filter(s=>s.pass===i).length),peak=Math.max(1,...counts);
 counts.forEach((n,i)=>{const b=el('button','wco-bin');b.type='button';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`${i} passing segments: ${n} samples`);const bar=el('i');bar.style.height=`${n/peak*155}px`;b.append(el('span','',n),bar,el('span','',i));b.addEventListener('click',()=>{clear();b.setAttribute('aria-pressed','true');show(rows.filter(s=>s.pass===i),`${i}/8 segments pass`);});bins.push(b);chart.append(b);});
 chartArea.append(chart,el('p','wco-note','Passing segments per sample (0–8)'));const reset=el('button','wco-reset','Show all samples');reset.type='button';reset.addEventListener('click',()=>{clear();show(rows,'All samples');});chartArea.append(reset);layout.append(chartArea,detail);panel.append(layout);ui.append(panel);
 const dp=el('div','wco-panel');dp.append(depthTitle,el('p','wco-note','Recorded “Min Median Depth” from Sample Detail (subtype_min_median_depth). Bar lengths use log10(depth + 1), on a fixed scale across the run. Color does not indicate QC status.'),selection,depths);ui.append(dp);
 const definitions=el('details');definitions.append(el('summary','','QC criteria and completeness definitions'));Array.from(original.children).filter(n=>['P','UL','OL'].includes(n.tagName)).forEach(n=>definitions.append(n.cloneNode(true)));ui.append(definitions);
 Array.from(tab.children).forEach(c=>c.hidden=true);tab.append(ui);show(rows,'All samples');
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();})();
</script>
